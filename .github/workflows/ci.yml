name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studiofy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studiofy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://studiofy_app:studiofy_app_password@localhost:5432/studiofy
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/studiofy
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Create restricted application database role
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE studiofy_app LOGIN PASSWORD 'studiofy_app_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE studiofy TO studiofy_app;
          GRANT USAGE ON SCHEMA public TO studiofy_app;
          SQL

      - name: Apply database migrations and security policies
        run: npm run db:rls --prefix backend

      - name: Grant application role access to the migrated schema
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO studiofy_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO studiofy_app;
          SQL

      - name: Run type checks and backend tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build backend and frontend
        run: npm run build
